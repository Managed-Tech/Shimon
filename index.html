<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dancing News</title>
    <!-- Using a Google Font that supports Hebrew characters nicely -->
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #111827;
            --bg-light: #F3F4F6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Heebo', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--primary-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
            padding: 2rem;
        }

        h1 {
            /* Adjusted font size so the longer phrase fits well */
            font-size: 8vw; 
            font-weight: 800;
            text-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            
            /* Flexbox to align words and allow wrapping on small screens */
            display: flex; 
            flex-wrap: wrap;
            justify-content: center;
            gap: 3vw; /* Space between words */
        }

        .word {
            display: flex;
        }

        .word span {
            display: inline-block;
            animation: boogie 1.5s infinite ease-in-out;
        }

        /* The jump and tilt animation */
        @keyframes boogie {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            25% {
                transform: translateY(-30px) rotate(-10deg);
                color: #2563EB; /* Flashes blue at the top of the jump */
            }
            50% {
                transform: translateY(10px) rotate(5deg);
            }
            75% {
                transform: translateY(-15px) rotate(15deg);
            }
        }

        /* Adjustments for mobile screens */
        @media (max-width: 768px) {
            h1 {
                font-size: 14vw;
                gap: 4vw;
            }
        }
    </style>
</head>
<body>

    <h1>
        <!-- Word 1: פֵײנֶע -->
        <div class="word">
            <span style="animation-delay: 0.0s">פֵ</span>
            <span style="animation-delay: 0.1s">ײ</span>
            <span style="animation-delay: 0.2s">נֶ</span>
            <span style="animation-delay: 0.3s">ע</span>
        </div>

        <!-- Word 2: פרישׁע -->
        <div class="word">
            <span style="animation-delay: 0.4s">פ</span>
            <span style="animation-delay: 0.5s">ר</span>
            <span style="animation-delay: 0.6s">י</span>
            <span style="animation-delay: 0.7s">שׁ</span>
            <span style="animation-delay: 0.8s">ע</span>
        </div>

        <!-- Word 3: נֵײעֶס -->
        <div class="word">
            <span style="animation-delay: 0.9s">נֵ</span>
            <span style="animation-delay: 1.0s">ײ</span>
            <span style="animation-delay: 1.1s">עֶ</span>
            <span style="animation-delay: 1.2s">ס</span>
        </div>
    </h1>

</body>
</html>
